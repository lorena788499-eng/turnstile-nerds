<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Turma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>⚙️ Editar Turma</h1>

    <form>
        <div class="form-group">
            <label>Nome da Turma</label>
            <input type="text" placeholder="Ex: Turma A - Manhã">
        </div>

        <div class="form-group">
            <label>Curso</label>
            <input type="text" placeholder="Ex: Desenvolvimento Web">
        </div>

        <div class="form-group">
            <label>Professor</label>
            <input type="text" placeholder="Ex: João Silva">
        </div>

        <div class="form-group">
            <label>Quantidade de Alunos</label>
            <input type="number" placeholder="Ex: 30">
        </div>

        <div class="form-group">
            <label>Horário</label>
            <input type="time">
        </div>

        <div class="buttons">
            <button type="submit" class="btn-save">💾 Salvar</button>
            <button type="reset" class="btn-cancel">❌ Cancelar</button>
        </div>
    </form>
</div>

</body>
</html>
