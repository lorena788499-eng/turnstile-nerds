<div class="page">

  <div class="header">
    <h1><span></span>Editar Turmas</h1>
  </div>

  <div class="card">
    <div class="form">

      <label>Nome da turma</label>
      <input type="text" placeholder="Insira novo nome da turma">

      <label>Período</label>
      <input type="text" placeholder="Insira o período da turma">

      <label>Ano letivo</label>
      <input type="text" placeholder="Insira ano letivo da turma">

      <label>Adicionar aluno</label>
      <input type="text" placeholder="Matrícula ou nome">

      <div class="actions">
        <button class="btn save">Salvar</button>
        <button class="btn delete">Excluir turma</button>
      </div>

    </div>
  </div>

</div>
