
<main class="content">
    <h1>Nova turma</h1>

    <div class="form-box">
      <label>Nome da turma</label>
      <input type="text" [(ngModel)]="turma.nome" placeholder="Insira nome da turma">

    <label>Período</label>

<mat-select class="input-verde" [(ngModel)]="turma.periodo">
  <mat-option value="manha">Manhã</mat-option>
  <mat-option value="tarde">Tarde</mat-option>
  <mat-option value="noite">Integral</mat-option>
</mat-select>

      <label>Ano letivo</label>
      <input type="text" [(ngModel)]="turma.ano" placeholder="Insira ano letivo da turma">

      <label>Capacidade</label>
      <input type="number" [(ngModel)]="turma.capacidade" placeholder="Insira a capacidade da turma">

      <label>Professor responsável</label>
      <input type="text" [(ngModel)]="turma.professor" placeholder="Insira o professor responsável">

      <div class="click">
      <button (click)="salvar()">Salvar</button>
      </div>
    </div>
  </main>
